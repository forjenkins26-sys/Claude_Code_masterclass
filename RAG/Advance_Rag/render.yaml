services:
  - type: web
    name: advanced-rag-explorer
    runtime: python
    plan: free
    region: singapore
    rootDir: RAG/Advance_Rag
    buildCommand: pip install -r requirements.txt
    # One worker: each worker loads its own copy of the embedder and reranker
    # (~400 MB resident), and the free instance has 512 MB.
    #
    # Two threads, not more: the work is ONNX inference, which already uses the
    # cores internally, and every extra thread holds its own request buffers.
    #
    # timeout 0 disables gunicorn's worker kill. The default 30 s would shoot
    # the worker during the /api/ingest/sse stream, which runs for minutes.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 0
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # The first deploy OOM-crash-looped on this instance. The cause was not
      # the corpus size but the embedding batch: one ONNX inference of 32
      # documents allocates a working arena that took RSS from 295 MB to
      # 587 MB in a single step, before a single point was indexed.
      #
      # Measured over 150 rows on this app:
      #   INGEST_BATCH=32  ->  588 MB   OOM on a 512 MB instance
      #   INGEST_BATCH=8   ->  418 MB
      #   INGEST_BATCH=4   ->  363 MB
      #
      # 4 is slower per row but is the difference between a running service and
      # a crash loop. Raise it on an instance with more headroom.
      - key: INGEST_BATCH
        value: "4"
      # Embedded Qdrant also keeps the collection resident, so points cost
      # memory on top of the batch arena. 1,200 rows leaves room under the cap
      # while keeping hybrid search, reranking and citations meaningful.
      # AUTO_SEED_LIMIT=0 seeds the full 5,000-row corpus.
      - key: AUTO_SEED
        value: "1"
      - key: AUTO_SEED_LIMIT
        value: "1200"
      # Keep the ONNX path: the bge models need ~2.9 GB of weights and 504 MB
      # resident, neither of which fits the free instance.
      - key: EMBED_BACKEND
        value: fast
      - key: RERANK_BACKEND
        value: fast
      # HF_HOME must point somewhere writable; the default (~/.cache) is not
      # guaranteed to be on a hosted container.
      - key: HF_HOME
        value: /tmp/hf
      - key: GROQ_API_KEY
        sync: false   # set in the Render dashboard, never committed
