<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playwright Test Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #151b23;
      --surface2:  #1a212b;
      --border:    #2a323d;
      --border2:   #3a4451;
      --text:      #e6edf3;
      --text2:     #8b96a5;
      --text3:     #5b6673;
      --accent:    #5b8ff0;
      --accent-bg: #182238;
      --green:     #3fb950;
      --green-bg:  #10261a;
      --amber:     #e0a13d;
      --amber-bg:  #2b2010;
      --blue:      #5b8ff0;
      --blue-bg:   #182238;
      --mono:      'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --serif:     'Playfair Display', Georgia, serif;
      --sans:      -apple-system, 'Segoe UI', system-ui, sans-serif;
      --radius:    10px;
      --shadow:    0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 12px 40px rgba(0,0,0,.45);
    }

    html { font-size: 16px; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    /* ── LAYOUT ───────────────────────── */
    .page { max-width: 780px; margin: 0 auto; }

    /* ── HEADER ───────────────────────── */
    .header {
      margin-bottom: 32px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-title-row { display: flex; align-items: flex-start; gap: 14px; }

    .header-glyph {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 9px;
      background: var(--accent-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }

    .header-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .conn-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .conn-badge .conn-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-bg);
    }

    .header-title {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .header-title em {
      font-style: normal;
      font-weight: 650;
      color: var(--text);
    }

    .header-sub {
      font-size: 13px;
      color: var(--text2);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ── CARDS ────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card-head {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
    }

    .card-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }

    .card-body { padding: 24px; }

    /* ── FORM ELEMENTS ────────────────── */
    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 7px;
    }

    .field-hint {
      font-size: 11px;
      color: var(--text3);
      margin-top: 5px;
      font-family: var(--mono);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.5;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 143, 240, .18);
    }

    input[type="text"]::placeholder, textarea::placeholder {
      color: var(--text3);
    }

    textarea { resize: vertical; min-height: 88px; }

    /* ── TWO COLS ─────────────────────── */
    .two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .two-cols { grid-template-columns: 1fr; }
    }

    /* ── FILE SELECTOR (styled as a dropzone; still a path input) ── */
    .two-cols.dropzones { position: relative; align-items: stretch; }

    .vs-divider {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 0.04em;
      z-index: 1;
    }
    @media (max-width: 560px) { .vs-divider { display: none; } }

    .file-slot {
      border: 1.5px dashed var(--border2);
      border-radius: 8px;
      padding: 16px;
      background: var(--surface2);
      position: relative;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .file-slot:hover, .file-slot:focus-within {
      border-color: var(--accent);
    }
    .file-slot.drag-over {
      border-color: var(--accent);
      border-style: solid;
      background: var(--accent-bg);
    }
    .file-slot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .file-slot-input {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .file-slot-chosen { text-align: center; padding: 6px 0 2px; }
    .file-slot-chosen .file-slot-drop-label {
      color: var(--text);
      font-weight: 600;
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
    }

    .file-slot-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .file-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .file-dot.one { background: var(--blue); }
    .file-dot.two { background: var(--green); }

    .file-slot-icon {
      text-align: center;
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text3);
      padding: 10px 0 6px;
    }
    .file-slot-drop-label {
      text-align: center;
      font-size: 12.5px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .file-slot-drop-sub {
      text-align: center;
      font-size: 10.5px;
      color: var(--text3);
      margin-bottom: 12px;
    }

    /* ── ADVANCED TOGGLE ──────────────── */
    .toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      margin-bottom: 16px;
      transition: color .15s;
    }
    .toggle-btn:hover { color: var(--accent); }
    .toggle-arrow { transition: transform .2s; display: inline-block; }
    .toggle-arrow.open { transform: rotate(90deg); }

    .advanced-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      background: var(--surface2);
      margin-bottom: 20px;
    }

    /* ── SUBMIT BUTTON ────────────────── */
    .btn-submit {
      width: 100%;
      padding: 14px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(91, 143, 240, .25);
    }
    .btn-submit:hover:not(:disabled) {
      background: #4a7de0;
      box-shadow: 0 4px 16px rgba(91, 143, 240, .35);
    }
    .btn-submit:active:not(:disabled) { transform: scale(.99); }
    .btn-submit:disabled {
      background: var(--text3);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ── SPINNER ──────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── RESULT PANEL ─────────────────── */
    .result-card { animation: fadeUp .35s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-status-bar {
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }
    .result-status-bar.success { background: var(--green-bg); color: var(--green); border-bottom: 1px solid #c6e8d4; }
    .result-status-bar.error   { background: var(--accent-bg); color: var(--accent); border-bottom: 1px solid #f0cfc4; }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .success .status-dot { background: var(--green); }
    .error   .status-dot { background: var(--accent); }

    .result-content {
      padding: 28px;
      font-size: 14.5px;
      line-height: 1.75;
      color: var(--text);
      font-weight: 300;
      white-space: pre-wrap;
      font-family: var(--sans);
    }

    .result-content strong {
      font-weight: 600;
      color: var(--text);
    }

    /* markdown-like formatting */
    .result-content p { margin-bottom: 14px; }
    .result-content ul, .result-content ol {
      padding-left: 24px;
      margin-bottom: 14px;
    }
    .result-content li { margin-bottom: 6px; }
    .result-content h1, .result-content h2, .result-content h3 {
      font-family: var(--serif);
      margin: 20px 0 10px;
      color: var(--text);
    }
    .result-content h1 { font-size: 20px; }
    .result-content h2 { font-size: 17px; }
    .result-content h3 { font-size: 15px; }
    .result-content code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--accent);
    }
    .result-content pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .result-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
    }

    /* ── RAW JSON PANEL ───────────────── */
    .raw-toggle {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    .raw-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      transition: color .15s;
    }
    .raw-btn:hover { color: var(--accent); }

    .raw-panel {
      padding: 0 24px 20px;
      background: var(--surface2);
    }

    .raw-code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text);
      line-height: 1.6;
      overflow-x: auto;
      max-height: 300px;
      white-space: pre;
    }

    /* ── LOADING CARD ─────────────────── */
    .loading-card {
      text-align: center;
      padding: 48px 24px;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .loading-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce .9s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: .15s; }
    .loading-dot:nth-child(3) { animation-delay: .30s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .loading-text {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 0.06em;
    }

    /* ── FOOTER ───────────────────────── */
    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }

    .footer-brand { display: flex; align-items: center; gap: 8px; }
    .footer-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    // ── Parse Langflow response → text ─────────────────────────────
    function extractText(data) {
      try {
        // Standard Langflow output shape
        const outputs = data?.outputs?.[0]?.outputs?.[0];
        if (outputs?.results?.message?.text) return outputs.results.message.text;
        if (outputs?.messages?.[0]?.message) return outputs.messages[0].message;
        if (outputs?.artifacts?.message) return outputs.artifacts.message;
        // Fallback: look for any string
        const str = JSON.stringify(data, null, 2);
        return str;
      } catch {
        return String(data);
      }
    }

    // ── Simple markdown → HTML (no deps) ──────────────────────────
    function renderMarkdown(text) {
      const lines = text.split('\n');
      const html = [];
      let inCode = false;
      let codeBuffer = [];

      for (const raw of lines) {
        const line = raw;

        if (line.startsWith('```')) {
          if (inCode) {
            html.push(`<pre><code>${codeBuffer.join('\n').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
            codeBuffer = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }

        if (inCode) { codeBuffer.push(line); continue; }

        const escaped = line
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`(.+?)`/g, '<code>$1</code>');

        if (/^###\s/.test(line))      html.push(`<h3>${escaped.slice(4)}</h3>`);
        else if (/^##\s/.test(line))  html.push(`<h2>${escaped.slice(3)}</h2>`);
        else if (/^#\s/.test(line))   html.push(`<h1>${escaped.slice(2)}</h1>`);
        else if (/^[-*]\s/.test(line))html.push(`<li>${escaped.slice(2)}</li>`);
        else if (/^\d+\.\s/.test(line))html.push(`<li>${escaped.replace(/^\d+\.\s/,'')}</li>`);
        else if (escaped.trim() === '')html.push('<br/>');
        else html.push(`<p>${escaped}</p>`);
      }

      // Wrap consecutive <li> in <ul>
      const joined = html.join('\n')
        .replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

      return joined;
    }

    // ── FILE DROPZONE (drag-drop + click-to-browse) ───────────────
    function FileDropzone({ file, onFile, accept, dotClass, label }) {
      const [dragOver, setDragOver] = useState(false);
      const inputRef = React.useRef(null);

      const pick = (fileList) => {
        const f = fileList && fileList[0];
        if (f) onFile(f);
      };

      return (
        <div
          className={`file-slot${dragOver ? ' drag-over' : ''}`}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={e => {
            e.preventDefault();
            setDragOver(false);
            pick(e.dataTransfer.files);
          }}
          onClick={() => inputRef.current && inputRef.current.click()}
          role="button"
          tabIndex={0}
          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') inputRef.current.click(); }}
        >
          <div className="file-slot-label">
            <span className={`file-dot ${dotClass}`} /> {label}
          </div>
          <input
            ref={inputRef}
            type="file"
            accept={accept}
            className="file-slot-input"
            onChange={e => pick(e.target.files)}
            onClick={e => e.stopPropagation()}
          />
          {file ? (
            <div className="file-slot-chosen">
              <span className="file-slot-icon" style={{ padding: '2px 0' }}>✓</span>
              <div className="file-slot-drop-label" style={{ marginBottom: 0 }}>{file.name}</div>
              <div className="file-slot-drop-sub">{(file.size / 1024).toFixed(1)} KB · click to change</div>
            </div>
          ) : (
            <>
              <div className="file-slot-icon">{'{ }'}</div>
              <div className="file-slot-drop-label">Drop results JSON</div>
              <div className="file-slot-drop-sub">or click to browse</div>
            </>
          )}
        </div>
      );
    }

    // ── MAIN APP ───────────────────────────────────────────────────
    function App() {
      const FLOW_ID = '0e382334-94a2-4387-a81a-d59a3a9293af';
      const API_KEY = 'sk-loRXK2aV2RtYaFq13HjeMnoQ_56o_IJG-amny63YeDY';
      const BASE_URL = 'http://localhost:7860';

      const [file1, setFile1] = useState(null); // File
      const [file2, setFile2] = useState(null); // File
      const [prompt, setPrompt] = useState(
        'Analyze these two Playwright runs and tell me which build has the most failing/flaky test.'
      );
      // Fixed node IDs for this flow's two File components (Build A -> file1,
      // Build B -> file2) — verified against GET /api/v1/flows/{FLOW_ID}
      // edges, 2026-07-11. Re-verify the same way if the flow is rebuilt.
      const FILE_NODE_1 = 'File-3NW6L';
      const FILE_NODE_2 = 'File-vJ8Bm';

      const [showRaw, setShowRaw] = useState(false);
      const [loading, setLoading] = useState(false);
      const [loadingStage, setLoadingStage] = useState(''); // 'uploading' | 'running'
      const [result, setResult] = useState(null); // { ok, text, raw }
      const [sessionId] = useState(() => `ui-session-${Date.now()}`);

      const canSubmit = file1 && file2 && !loading;

      // Upload one file to Langflow via our server proxy — returns the
      // server-assigned file_path Langflow expects in `tweaks`.
      const uploadFile = async (file) => {
        const buf = await file.arrayBuffer();
        const res = await fetch('/proxy/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/octet-stream',
            'filename': file.name,
            'flowid': FLOW_ID,
            'baseurl': BASE_URL,
            'apikey': API_KEY,
          },
          body: buf,
        });
        const json = await res.json();
        if (!json.ok) throw new Error(`Upload failed for ${file.name}: ${JSON.stringify(json.data || json.error)}`);
        return json.data.file_path;
      };

      const handleSubmit = async () => {
        setLoading(true);
        setResult(null);
        setShowRaw(false);

        let filePath1, filePath2;
        try {
          setLoadingStage('uploading');
          [filePath1, filePath2] = await Promise.all([uploadFile(file1), uploadFile(file2)]);
        } catch (err) {
          setResult({ ok: false, text: `Upload failed: ${err.message}`, raw: '' });
          setLoading(false);
          setLoadingStage('');
          return;
        }
        setLoadingStage('running');

        const tweaks = {};
        tweaks[FILE_NODE_1] = { path: [filePath1] };
        tweaks[FILE_NODE_2] = { path: [filePath2] };

        const body = {
          output_type: 'chat',
          input_type: 'text',
          input_value: prompt,
          session_id: sessionId,
          tweaks,
        };

        const url = `${BASE_URL}/api/v1/run/${FLOW_ID}?stream=false`;

        try {
          const res = await fetch('/proxy/langflow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, apiKey: API_KEY, body }),
          });

          const json = await res.json();

          if (json.ok) {
            const text = extractText(json.data);
            setResult({ ok: true, text, raw: JSON.stringify(json.data, null, 2) });
          } else {
            const errText = JSON.stringify(json.data || json, null, 2);
            setResult({ ok: false, text: `API error (${json.status})\n\n${errText}`, raw: errText });
          }
        } catch (err) {
          setResult({
            ok: false,
            text: `Request failed: ${err.message}\n\nMake sure the server is running (node server.js) and Langflow is up at localhost:7860.`,
            raw: ''
          });
        } finally {
          setLoading(false);
          setLoadingStage('');
        }
      };

      return (
        <div className="page">

          {/* ── HEADER ── */}
          <header className="header">
            <div className="header-title-row">
              <div className="header-glyph">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 22V4a2 2 0 0 1 2-2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
                  <path d="M14 2v5h5" />
                  <path d="m9 15 2 2 4-4" />
                </svg>
              </div>
              <div>
                <h1 className="header-title">Flaky Test Analyzer</h1>
                <p className="header-sub">Compare two Playwright runs · LangFlow AI agent</p>
              </div>
            </div>
            <span className="conn-badge">
              <span className="conn-dot" />
              LangFlow
            </span>
          </header>

          {/* ── CARD 1: FILE PATHS (styled as dropzones) ── */}
          <div className="card">
            <div className="card-head">
              <span className="card-num">1</span>
              <span className="card-title">Select Result Files</span>
            </div>
            <div className="card-body">
              <div className="two-cols dropzones">
                <FileDropzone
                  file={file1}
                  onFile={setFile1}
                  accept=".json"
                  dotClass="one"
                  label="Build A — Baseline"
                />
                <span className="vs-divider">VS</span>
                <FileDropzone
                  file={file2}
                  onFile={setFile2}
                  accept=".json"
                  dotClass="two"
                  label="Build B — Candidate"
                />
              </div>
            </div>
          </div>

          {/* ── CARD 2: PROMPT ── */}
          <div className="card">
            <div className="card-head">
              <span className="card-num">2</span>
              <span className="card-title">Analysis Prompt</span>
            </div>
            <div className="card-body">
              <div className="field">
                <textarea
                  value={prompt}
                  onChange={e => setPrompt(e.target.value)}
                  rows={3}
                  style={{ fontFamily: 'var(--sans)', fontSize: '14px' }}
                />
              </div>
            </div>
          </div>

          {/* ── CARD 3: RUN ── */}
          <div className="card">
            <div className="card-head">
              <span className="card-num">3</span>
              <span className="card-title">Run</span>
            </div>
            <div className="card-body">

              <button
                className="btn-submit"
                onClick={handleSubmit}
                disabled={!canSubmit}
              >
                {loading ? (
                  <>
                    <span className="spinner" />
                    Analyzing…
                  </>
                ) : (
                  <>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Run Analysis
                  </>
                )}
              </button>
            </div>
          </div>

          {/* ── LOADING ── */}
          {loading && (
            <div className="card">
              <div className="card-body loading-card">
                <div className="loading-dots">
                  <div className="loading-dot" />
                  <div className="loading-dot" />
                  <div className="loading-dot" />
                </div>
                <div className="loading-text">
                  {loadingStage === 'uploading' ? 'Uploading result files…' : 'Langflow is processing your test results…'}
                </div>
              </div>
            </div>
          )}

          {/* ── RESULT ── */}
          {result && !loading && (
            <div className="card result-card">
              <div className="card-head">
                <span className="card-num" style={{ background: result.ok ? 'var(--green)' : 'var(--accent)' }}>
                  {result.ok ? '✓' : '!'}
                </span>
                <span className="card-title">Analysis Result</span>
              </div>

              <div className={`result-status-bar ${result.ok ? 'success' : 'error'}`}>
                <span className="status-dot" />
                {result.ok ? 'Langflow responded successfully' : 'Request failed'}
              </div>

              <div
                className="result-content"
                dangerouslySetInnerHTML={{ __html: renderMarkdown(result.text) }}
              />

              {result.raw && (
                <>
                  <div className="raw-toggle">
                    <button className="raw-btn" onClick={() => setShowRaw(v => !v)}>
                      <span className={`toggle-arrow ${showRaw ? 'open' : ''}`} style={{ fontSize: '10px' }}>▶</span>
                      Raw JSON response
                    </button>
                  </div>
                  {showRaw && (
                    <div className="raw-panel">
                      <pre className="raw-code">{result.raw}</pre>
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* ── FOOTER ── */}
          <footer className="footer">
            <div className="footer-brand">
              <span className="footer-dot" />
              Playwright Test Analyzer
            </div>
            <span>Langflow · localhost:7860</span>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
